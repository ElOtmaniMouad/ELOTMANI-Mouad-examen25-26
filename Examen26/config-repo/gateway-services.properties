# MS-Gateway Configuration
spring.application.name=gateway-services
server.port=8888

# Gateway Routes Configuration
# Route for ms-client
spring.cloud.gateway.routes[0].id=ms-etudiant
spring.cloud.gateway.routes[0].uri=lb://ms-etudiant
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/etudiants/**

# Route for ms-produit
spring.cloud.gateway.routes[1].id=ms-produit
spring.cloud.gateway.routes[1].uri=lb://ms-produit
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/livres/**

# Route for ms-emprunt2
spring.cloud.gateway.routes[2].id=ms-emprunt
spring.cloud.gateway.routes[2].uri=lb://ms-emprunt
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/emprunts/**

# CORS Configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Gateway Discovery Locator (optional - enables automatic route discovery)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Test Properties
test.message=Gateway Service Config Working!