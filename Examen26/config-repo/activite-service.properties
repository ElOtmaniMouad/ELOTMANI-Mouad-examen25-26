# MS-Activity Configuration
spring.application.name=activite-service
server.port=5032

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:activitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Test Properties
    test.message=Activity Service Config Working!
service.description=Activity Management Service